[project]
name = "zmovies"
version = "0.1.0"
description = "Personal read-only web view of watched movies, driven by Letterboxd CSV exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zmovies"]
